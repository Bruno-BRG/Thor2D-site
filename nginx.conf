# Static-site server: gzip, long-cache immutable assets, no-cache HTML.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docs use query strings (docs.html?page=…): plain static serving is enough.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache HTML entry points (instant updates on redeploy).
    location ~* \.(html|md)$ {
        expires -1;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Long-cache hashed-by-deploy static assets.
    location ~* \.(css|js|svg|png|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/markdown;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
